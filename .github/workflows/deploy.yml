name: Deploy to Production

on:
  workflow_run:
    workflows: ["Test Suite"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Notify deployment ready
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Log deployment trigger
        run: |
          echo "Tests passed on main branch."
          echo "Production hosts poll origin/main every 5 minutes via"
          echo "scripts/self-update.sh, which gates on these check results"
          echo "when GUILDSERVER_REQUIRE_CI=enforce."
          echo "Commit: ${{ github.event.workflow_run.head_sha }}"

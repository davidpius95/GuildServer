name: Test Suite

on:
  push:
    # acceptance/** branches run the suite without touching main, to prove a
    # change (such as a new check) before it can gate production deploys.
    branches: [main, develop, 'acceptance/**']
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'

# The pnpm workspace lives in a subdirectory of the repository. Workflows must
# sit at the repository root for GitHub to run them at all, so every job runs
# its commands from the workspace directory instead.
defaults:
  run:
    working-directory: guildserver-paas

jobs:
  # Lint and Type Check
  lint-and-typecheck:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: guildserver-paas/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: guildserver-paas/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm --filter @guildserver/web lint

      - name: Run TypeScript check (database, strict)
        run: pnpm --filter @guildserver/database typecheck

      # apps/api and apps/web predate CI and carry type errors production does
      # not compile against (the API runs under tsx; next.config ignores build
      # type errors). Fail only if a change adds errors; see the script.
      - name: TypeScript error ratchet (api, web)
        run: |
          pnpm --filter @guildserver/database build
          bash scripts/typecheck-ratchet.sh apps/api apps/api/.typecheck-baseline
          bash scripts/typecheck-ratchet.sh apps/web apps/web/.typecheck-baseline

  # Unit and Integration Tests
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: guildserver_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: guildserver-paas/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: guildserver-paas/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U test; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

      - name: Run database migrations
        run: pnpm --filter @guildserver/database db:migrate
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/guildserver_test

      # Catches the class of bug where a column is declared in schema/index.ts
      # but no migration creates it — which shipped undetected until now and
      # left every fresh install with a schema the code could not use.
      # instance_types/instances are provisioned by a separate script rather
      # than by a migration, so a fresh install needs both steps. Documented
      # here because db:verify treats their absence as drift, correctly.
      - name: Provision instance tables
        run: pnpm --filter @guildserver/database db:migrate-instances
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/guildserver_test

      - name: Verify schema matches migrations
        run: pnpm --filter @guildserver/database db:verify
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/guildserver_test

      - name: Run migration-runner tests
        run: pnpm --filter @guildserver/database test
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/guildserver_test
          # The harness creates and drops its own mig_runner_test_* databases
          # through this admin URL. It defaults to the local test Postgres on
          # 5433; the CI service listens on 5432.
          TEST_DB_ADMIN_URL: postgresql://test:test@localhost:5432/postgres

      # Off-site backup tests talk to a real S3 API. MinIO needs a command
      # (`server /data`), which service containers cannot be given, so it is
      # started here instead of under `services:`.
      - name: Start MinIO
        working-directory: .
        run: |
          docker run -d --name minio -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER=gs-test-access \
            -e MINIO_ROOT_PASSWORD=gs-test-secret-key \
            minio/minio:latest server /data
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:9000/minio/health/live && exit 0
            sleep 2
          done
          echo "MinIO did not become healthy"; docker logs minio; exit 1

      # @guildserver/database resolves to dist/ (package.json "main"), which is
      # gitignored. Everything above runs the package's own source through tsx;
      # the API tests import the built package.
      - name: Build database package
        run: pnpm --filter @guildserver/database build

      - name: Run backend tests
        run: pnpm --filter @guildserver/api test:ci
        env:
          TEST_DATABASE_URL: postgresql://test:test@localhost:5432/guildserver_test
          DATABASE_URL: postgresql://test:test@localhost:5432/guildserver_test
          REDIS_URL: redis://localhost:6379/1
          # tests/env.ts reads TEST_REDIS_URL and otherwise uses the local
          # throwaway Redis on 6380, which does not exist on the runner.
          TEST_REDIS_URL: redis://localhost:6379/1
          JWT_SECRET: test-jwt-secret-key-for-ci
          NODE_ENV: test
          GS_MINIO_TESTS: '1'
          TEST_S3_ENDPOINT: http://127.0.0.1:9000
          TEST_S3_ACCESS_KEY: gs-test-access
          TEST_S3_SECRET_KEY: gs-test-secret-key
          # The test MinIO is on loopback, which production always refuses.
          GS_S3_ALLOW_PRIVATE_ENDPOINTS: '1'
          GS_S3_ALLOW_LOOPBACK_ENDPOINTS: '1'

      - name: Upload backend coverage
        # Coverage reporting is informational. An upload failure (Codecov outage,
        # rate limit, missing token) must not fail the job: production deploys
        # are gated on these checks.
        continue-on-error: true
        uses: codecov/codecov-action@v4
        with:
          files: ./guildserver-paas/apps/api/coverage/lcov.info
          flags: backend
          name: backend-coverage

  # Frontend Tests
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: guildserver-paas/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: guildserver-paas/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend tests
        run: pnpm --filter @guildserver/web test
        env:
          NODE_ENV: test

      - name: Upload frontend coverage
        # Coverage reporting is informational. An upload failure (Codecov outage,
        # rate limit, missing token) must not fail the job: production deploys
        # are gated on these checks.
        continue-on-error: true
        uses: codecov/codecov-action@v4
        with:
          files: ./guildserver-paas/apps/web/coverage/lcov.info
          flags: frontend
          name: frontend-coverage

  # End-to-End Tests
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: guildserver_e2e_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    # Read by the database scripts, the web build (API_URL feeds the /trpc
    # rewrite) and the API and web servers Playwright starts.
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/guildserver_e2e_test
      REDIS_URL: redis://localhost:6379/2
      JWT_SECRET: test-jwt-secret-key-for-e2e
      PORT: '4000'
      FRONTEND_URL: http://localhost:3000
      API_URL: http://localhost:4000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: guildserver-paas/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: guildserver-paas/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright's Chromium
        run: pnpm --filter @guildserver/web exec playwright install --with-deps chromium

      - name: Wait for services
        run: |
          until pg_isready -h localhost -p 5432 -U test; do sleep 2; done
          # redis-cli is not installed on the runner; probe the port instead.
          until (exec 3<>/dev/tcp/localhost/6379) 2>/dev/null; do sleep 2; done

      - name: Prepare the database
        run: |
          pnpm --filter @guildserver/database db:migrate
          pnpm --filter @guildserver/database db:migrate-instances
          pnpm --filter @guildserver/database build

      - name: Build the web app
        run: pnpm --filter @guildserver/web build

      # Starts the API and web servers itself (see apps/web/playwright.config.ts)
      # and reports failures as annotations.
      - name: Run E2E tests
        run: pnpm --filter @guildserver/web exec playwright test

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: guildserver-paas/apps/web/test-results/
          retention-days: 7
  # Build Test
  build-test:
    name: Build Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: guildserver-paas/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: guildserver-paas/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build what production builds. The API image runs its TypeScript under
      # tsx and never compiles it with tsc (apps/api/Dockerfile); type errors
      # are held by the ratchet in the lint job instead.
      - name: Build packages
        run: pnpm --filter @guildserver/database --filter @guildserver/web build
        env:
          NODE_ENV: production

      - name: Test Docker builds
        run: |
          docker build -f apps/api/Dockerfile -t guildserver-api:test .
          docker build -f apps/web/Dockerfile -t guildserver-web:test .
          docker build -f apps/docs/Dockerfile -t guildserver-docs:test .

  # Security Audit
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    # CodeQL uploads results to code scanning; the default token is read-only.
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: guildserver-paas/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: guildserver-paas/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run security audit
        run: pnpm audit --audit-level=high || true

      - name: Run CodeQL Analysis
        uses: github/codeql-action/init@v3
        with:
          languages: javascript,typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  # Dependency Check
  dependency-check:
    name: Dependency Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: guildserver-paas/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: guildserver-paas/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for outdated dependencies
        run: pnpm outdated --long || true

      - name: Check for vulnerabilities
        run: pnpm audit --audit-level=moderate || true

  # Test Summary
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, backend-tests, frontend-tests, e2e-tests, build-test, security-audit]
    if: always()
    # This job does not check out the repository, so the workflow-wide
    # working directory (guildserver-paas) does not exist here.
    defaults:
      run:
        working-directory: .

    steps:
      - name: Check test results
        run: |
          echo "Lint and Type Check: ${{ needs.lint-and-typecheck.result }}"
          echo "Backend Tests: ${{ needs.backend-tests.result }}"
          echo "Frontend Tests: ${{ needs.frontend-tests.result }}"
          echo "E2E Tests: ${{ needs.e2e-tests.result }}"
          echo "Build Test: ${{ needs.build-test.result }}"
          echo "Security Audit: ${{ needs.security-audit.result }}"

          if [[ "${{ needs.lint-and-typecheck.result }}" != "success" ]] || \
             [[ "${{ needs.backend-tests.result }}" != "success" ]] || \
             [[ "${{ needs.frontend-tests.result }}" != "success" ]] || \
             [[ "${{ needs.e2e-tests.result }}" != "success" && "${{ needs.e2e-tests.result }}" != "skipped" ]] || \
             [[ "${{ needs.build-test.result }}" != "success" ]]; then
            echo "Some tests failed!"
            exit 1
          fi

          echo "All tests passed!"
